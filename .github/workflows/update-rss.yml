name: Update Xiaoyuzhou RSS

on:
  # Manual trigger / API trigger.
  workflow_dispatch:
    inputs:
      mode:
        description: "Update mode"
        required: true
        type: choice
        options:
          - all
          - single

      feed_id:
        description: "Feed ID (required for single mode)"
        required: false
        type: string

  # Taipei time:
  # 08:00 = 00:00 UTC
  # 13:00 = 05:00 UTC
  # 18:00 = 10:00 UTC
  schedule:
    - cron: "0 0,5,10 * * *"

permissions:
  contents: write


jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update all feeds
        if: >
          github.event_name == 'schedule' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.mode == 'all'
          )
        run: |
          python generate.py --all

      - name: Update single feed
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.mode == 'single'
        run: |
          if [ -z "${{ github.event.inputs.feed_id }}" ]; then
            echo "feed_id is required for single mode"
            exit 1
          fi

          python generate.py \
            --feed "${{ github.event.inputs.feed_id }}"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Update RSS feeds"
            git push
          fi
