name: Update Xiaoyuzhou RSS

on:

  workflow_dispatch:

    inputs:

      feed_id:
        description: "Feed ID. Leave empty to update all feeds."
        required: false
        type: string


permissions:
  contents: write


jobs:

  update-rss:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      - name: Show environment
        run: |

          echo "========================================"
          echo "Python"
          python --version

          echo
          echo "Working directory"
          pwd

          echo
          echo "Repository files"
          ls -la

          echo
          echo "feeds.txt"
          cat feeds.txt

          echo "========================================"


      - name: Test Xiaoyuzhou connection
        run: |

          python - <<'PY'

          import urllib.request
          import ssl

          url = "https://feed.xyzfm.space/6xkltdh9kfav"

          print("Testing:")
          print(url)
          print()

          print("Python SSL:")
          print(ssl.OPENSSL_VERSION)
          print()

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(compatible; xyzrss/1.0)"
                  ),
                  "Accept": (
                      "application/rss+xml, "
                      "application/xml, "
                      "text/xml, "
                      "*/*"
                  ),
              },
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  print(
                      "HTTP status:",
                      response.status
                  )

                  print(
                      "Content-Type:",
                      response.headers.get(
                          "Content-Type"
                      )
                  )

                  data = response.read()

                  print(
                      "Downloaded bytes:",
                      len(data)
                  )

                  print()
                  print(
                      "First 500 bytes:"
                  )

                  print(
                      data[:500]
                  )

          except Exception as error:

              print()
              print(
                  "REQUEST FAILED"
              )

              print(
                  "Exception type:",
                  type(error).__name__
              )

              print(
                  "Exception:",
                  str(error)
              )

              raise

          PY


      - name: Update all feeds
        if: ${{ github.event.inputs.feed_id == '' || github.event.inputs.feed_id == null }}
        run: |

          python generate.py --all


      - name: Update single feed
        if: ${{ github.event.inputs.feed_id != '' && github.event.inputs.feed_id != null }}
        run: |

          python generate.py \
            --feed "${{ github.event.inputs.feed_id }}"


      - name: Commit generated files
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then

            echo "No generated changes."

            exit 0

          fi

          git commit \
            -m "Update RSS feeds"

          git push
