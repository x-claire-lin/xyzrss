<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Xiaoyuzhou RSS Fixer</title>

  <meta
    name="description"
    content="Make Xiaoyuzhou podcasts compatible with Anytime Player."
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="container">

    <header class="hero">
      <div class="hero-icon">♫</div>

      <div>
        <h1>Xiaoyuzhou RSS Fixer</h1>
        <p>
          Make Xiaoyuzhou podcasts compatible with Anytime Player.
        </p>
      </div>
    </header>


    <section class="card">

      <h2>Add a podcast</h2>

      <p class="muted">
        Paste a Xiaoyuzhou RSS URL to check and add it to the library.
      </p>

      <form id="rss-form">

        <div class="input-row">
          <input
            id="rss-url"
            type="url"
            placeholder="https://feed.xyzfm.space/..."
            autocomplete="off"
            required
          >

          <button id="check-button" type="submit">
            Check RSS
          </button>
        </div>

      </form>

      <div id="status" class="status hidden"></div>

      <div id="preview" class="preview hidden"></div>

    </section>


    <section class="card">

      <div class="section-header">

        <div>
          <h2>My podcasts</h2>
          <p class="muted">
            Compatible RSS feeds generated by this project.
          </p>
        </div>

        <div class="actions">
          <button id="select-all" class="secondary">
            Select all
          </button>

          <button id="generate-opml" class="secondary">
            Generate OPML
          </button>
        </div>

      </div>

      <div id="feed-list" class="feed-list">

        <div class="loading">
          Loading podcasts...
        </div>

      </div>

    </section>


    <footer>

      <p>
        RSS transformation:
        <code>audio/mp4</code>
        →
        <code>audio/x-m4a</code>
      </p>

      <p>
        <a
          href="https://github.com/x-claire-lin/xyzrss"
          target="_blank"
          rel="noopener"
        >
          GitHub
        </a>
      </p>

    </footer>

  </main>


  <script src="./app.js"></script>

</body>
</html>
